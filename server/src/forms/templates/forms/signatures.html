<table class="signatures w-full border-collapse border border-black">
  <thead>
    <tr>
      <th class="border border-black bg-gray-100 px-2 py-2 text-center font-semibold">구분</th>
      <th class="border border-black bg-gray-100 px-2 py-2 text-center font-semibold">서명</th>
      <th class="border border-black bg-gray-100 px-2 py-2 text-center font-semibold">성명</th>
      <th class="border border-black bg-gray-100 px-2 py-2 text-center font-semibold">연락처</th>
      <th class="border border-black bg-gray-100 px-2 py-2 text-center font-semibold">주소</th>
    </tr>
  </thead>
  <tbody>
    {% for sig in signatures %}
    <tr>
      <td class="border border-black px-2 py-2 text-center font-semibold">{{ sig.label }}</td>
      <td class="border border-black px-2 py-2 text-center"><span class="fill-short"></span> <span class="text-gray-500">(인)</span></td>
      <td class="border border-black px-2 py-2"><span class="fill-medium">{{ sig.name | default(value="") }}</span></td>
      <td class="border border-black px-2 py-2"><span class="fill-medium"></span></td>
      <td class="border border-black px-2 py-2"><span class="fill-wide"></span></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
