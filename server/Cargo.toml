[package]
name = "resm-server"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "resm_server"
path = "src/lib.rs"

[[bin]]
name = "resm-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = "0.4.45"
cuid2 = "0.1.6"
dotenvy = "0.15.7"
hex = "0.4.3"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
