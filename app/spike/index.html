<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RESM 우편번호 실험</title>
</head>
<body>
  <!-- Task 1 실험용 임시 페이지. 원본 postcode-search.tsx 와 같은 방식(동적 로드 + embed). -->
  <button id="open" type="button">주소 검색</button>
  <p>origin: <span id="origin"></span></p>
  <p>우편번호: <span id="zonecode"></span></p>
  <p>도로명주소: <span id="road"></span></p>
  <div id="wrap" style="height: 28rem"></div>
  <script>
    const SCRIPT_SRC = "https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"
    document.getElementById("origin").textContent = location.origin

    function loadScript() {
      return new Promise((resolve, reject) => {
        if (window.daum && window.daum.Postcode) { resolve(); return }
        const s = document.createElement("script")
        s.src = SCRIPT_SRC
        s.async = true
        s.onload = () => resolve()
        s.onerror = () => reject(new Error("우편번호 스크립트 로드 실패"))
        document.body.appendChild(s)
      })
    }

    document.getElementById("open").addEventListener("click", async () => {
      const wrap = document.getElementById("wrap")
      await loadScript()
      if (wrap.hasChildNodes()) return
      new window.daum.Postcode({
        oncomplete: (data) => {
          document.getElementById("zonecode").textContent = data.zonecode
          document.getElementById("road").textContent = data.roadAddress
        },
        width: "100%",
        height: "100%",
      }).embed(wrap)
    })
  </script>
</body>
</html>
