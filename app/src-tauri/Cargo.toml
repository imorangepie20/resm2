[package]
name = "resm-app"
version = "0.1.0"
description = "RESM 앱 셸 (Windows, Android)"
edition = "2021"

[lib]
# 이름 끝 `_lib` 는 Windows에서 bin과 lib 이름이 겹치지 않게 하려는 것 (cargo#8519)
name = "resm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
