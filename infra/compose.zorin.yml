# resm Rust 서버(resm-server) 전용 compose. 기존 real-es 스택(~/apps/real-es)과 분리된 project 로 실행한다.
#   docker compose -p resm-rust -f infra/compose.zorin.yml up -d --build
# 기존 스택의 컨테이너·볼륨·네트워크는 선언하지도 수정하지도 않는다(네트워크는 external 참조만).
name: resm-rust # 명령에는 항상 -p resm-rust 를 붙인다(환경 변수 COMPOSE_PROJECT_NAME 이 이 값보다 우선한다)

services:
  resm-server:
    image: resm-server:${RESM_VERSION:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: resm-server
    restart: unless-stopped
    # PID 1 이 SIGTERM 을 무시하지 않도록 init(tini) 사용 → docker stop 이 즉시 끝난다.
    init: true
    env_file:
      - ./resm.env
    ports:
      - "127.0.0.1:3105:3104" # 호스트 3104 는 Zorin 의 다른 서비스가 사용 중
    healthcheck:
      # 런타임 이미지에 curl/wget 이 없어 bash 의 /dev/tcp 로 직접 GET 한다(추가 패키지 없음).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/3104 &&
          printf 'GET /api/v1/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0" # 로그인 폭주(bcrypt)가 같은 호스트의 운영 앱·DB 를 굶기지 않게
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

# 기존 real-es 스택이 만든 네트워크에 참여만 한다(이름은 real-es/infra/compose.zorin.yml 의 name: 값).
networks:
  frontend:
    name: real-es-frontend
    external: true
  backend:
    name: real-es-backend
    external: true
